<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Hopscotch Phrase Cards</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap"
    />
    <style>
      /* Layout: one centred column (max 640px). Purple-to-magenta header with a small hopscotch mark, tab bar, then the active tab on beige. Purple, magenta, coral, gold, beige, tan, brown. */
      :root {
        --bg: #f6ebdc;
        --surface: #fffaf2;
        --ink: #2d1240;
        --ink2: #6e5148;
        --line: #e2cdb0;
        --acc: #6b2fb3;
        --acc-ink: #6b2fb3;
        --onacc: #ffffff;
        --mag: #b3216f;
        --coral: #f26b5a;
        --gold: #f2a52b;
        --tan: #d8bf9b;
        --brown: #7a4f2e;
        --soft: #f8e6da;
        --ok: #2b7a4b;
        --okbg: #e0f2e4;
        --okfill: #2b7a4b;
        --onok: #ffffff;
        --bad: #b3261e;
        --badbg: #fbe1db;
        --warn: #9a5b00;
        --grad: linear-gradient(135deg, #34104d 0%, #6b2fb3 55%, #c2277d 100%);
        --bargrad: linear-gradient(90deg, #6b2fb3, #c2277d 60%, #f26b5a);
        --shadow: 0 6px 22px rgba(45, 18, 64, 0.12);
        --f-head: "Lexend", "Inter", system-ui, sans-serif;
        --f-body: "Inter", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c0e27;
          --surface: #2b1738;
          --ink: #f7ecdf;
          --ink2: #cdb4a6;
          --line: #4b3059;
          --acc: #8a4bd6;
          --acc-ink: #d9b8ff;
          --onacc: #ffffff;
          --mag: #ff8cc4;
          --coral: #ff8f7c;
          --gold: #f8c25e;
          --tan: #5c4358;
          --brown: #d1a97f;
          --soft: #3b2248;
          --ok: #6fd49a;
          --okbg: #1e3d2c;
          --okfill: #6fd49a;
          --onok: #0d2a1b;
          --bad: #ff9a8d;
          --badbg: #4a2224;
          --warn: #f0c060;
          --grad: linear-gradient(
            135deg,
            #240a38 0%,
            #4b1f80 55%,
            #92226a 100%
          );
          --bargrad: linear-gradient(90deg, #8a4bd6, #d6479a 60%, #ff8f7c);
          --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c0e27;
        --surface: #2b1738;
        --ink: #f7ecdf;
        --ink2: #cdb4a6;
        --line: #4b3059;
        --acc: #8a4bd6;
        --acc-ink: #d9b8ff;
        --onacc: #ffffff;
        --mag: #ff8cc4;
        --coral: #ff8f7c;
        --gold: #f8c25e;
        --tan: #5c4358;
        --brown: #d1a97f;
        --soft: #3b2248;
        --ok: #6fd49a;
        --okbg: #1e3d2c;
        --okfill: #6fd49a;
        --onok: #0d2a1b;
        --bad: #ff9a8d;
        --badbg: #4a2224;
        --warn: #f0c060;
        --grad: linear-gradient(135deg, #240a38 0%, #4b1f80 55%, #92226a 100%);
        --bargrad: linear-gradient(90deg, #8a4bd6, #d6479a 60%, #ff8f7c);
        --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 var(--f-body);
        padding-block: 0 48px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      header.top {
        background: var(--grad);
        color: #fff;
        border-radius: 0 0 22px 22px;
        padding: 22px 20px 18px;
        margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
        margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
        padding-left: max(20px, env(safe-area-inset-left, 0px));
        padding-right: max(20px, env(safe-area-inset-right, 0px));
      }
      header.top h1 {
        font: 700 clamp(24px, 6.4vw, 32px)/1.15 var(--f-head);
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header.top h1 svg {
        width: 26px;
        height: 34px;
        flex: none;
      }
      header.top p {
        margin: 0;
        opacity: 0.92;
        font-size: 14px;
      }
      .toprow {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .lang {
        display: flex;
        gap: 2px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        padding: 3px;
        flex: none;
      }
      .lang button {
        border: 0;
        background: none;
        color: #fff;
        font: 600 13px var(--f-body);
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .lang button.on {
        background: var(--surface);
        color: var(--ink);
      }
      .tabs {
        display: flex;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 5px;
      }
      .tabs button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--ink2);
        font: 600 14px var(--f-body);
        padding: 10px 6px;
        border-radius: 10px;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: var(--acc);
        color: var(--onacc);
      }
      button {
        font-family: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .card:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1.5px solid var(--tan);
        background: var(--surface);
        color: var(--ink);
        border-radius: 999px;
        padding: 7px 14px;
        font: 500 14px var(--f-body);
        cursor: pointer;
      }
      .chip small {
        color: var(--ink2);
        margin-left: 4px;
      }
      .chip.on {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--onacc);
      }
      .chip.on small {
        color: var(--onacc);
        opacity: 0.85;
      }
      .seg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 8px 4px;
        border-radius: 9px;
        font: 500 13px var(--f-body);
        color: var(--ink2);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--soft);
        color: var(--acc-ink);
        font-weight: 600;
        box-shadow: inset 0 0 0 1.5px var(--acc-ink);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .row.sp {
        justify-content: space-between;
      }
      .stats {
        font-size: 13px;
        color: var(--ink2);
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--bargrad);
        border-radius: 99px;
        transition: width 0.25s;
      }
      .cnt {
        font: 600 13px var(--f-body);
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 22px 18px;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        cursor: pointer;
        min-width: 0;
      }
      .card.back {
        align-items: stretch;
        text-align: left;
        justify-content: flex-start;
        cursor: default;
      }
      .lab {
        align-self: center;
        font: 600 11px var(--f-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--acc-ink);
        background: var(--soft);
        padding: 4px 10px;
        border-radius: 99px;
      }
      .big {
        font: 600 clamp(28px, 8.5vw, 42px)/1.15 var(--f-head);
        overflow-wrap: anywhere;
        text-wrap: balance;
        margin: 0;
      }
      .big.sm {
        font-size: clamp(20px, 5.6vw, 26px);
      }
      .tap {
        font-size: 13px;
        color: var(--ink2);
      }
      .bhead {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .b-en {
        font: 600 13px var(--f-body);
        color: var(--ink2);
      }
      .b-uk {
        font: 600 clamp(20px, 5.6vw, 26px)/1.25 var(--f-head);
        color: var(--acc-ink);
        margin: 0;
      }
      .ex {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
        background: var(--soft);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .gap {
        border: 0;
        border-bottom: 3px solid var(--gold);
        background: none;
        color: var(--mag);
        font: 700 18px var(--f-body);
        min-width: 64px;
        cursor: pointer;
        padding: 0 4px;
      }
      .cols {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .cols span {
        background: var(--soft);
        border: 1px solid var(--tan);
        color: var(--brown);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 14px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font: 600 15px var(--f-body);
        cursor: pointer;
        background: var(--acc);
        color: var(--onacc);
        text-decoration: none;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
      }
      .btn.ghost {
        background: var(--surface);
        color: var(--acc-ink);
        border: 1.5px solid var(--tan);
      }
      .btn.good {
        background: var(--okfill);
        color: var(--onok);
      }
      .btn.warn {
        background: var(--surface);
        color: var(--bad);
        border: 1.5px solid var(--bad);
      }
      .btn.wide {
        flex: 1;
        min-width: 130px;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .btn svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .sw {
        display: flex;
        gap: 8px;
      }
      .tog {
        border: 1.5px solid var(--tan);
        background: var(--surface);
        color: var(--ink2);
        padding: 7px 14px;
        border-radius: 999px;
        font: 500 14px var(--f-body);
        cursor: pointer;
      }
      .tog.on {
        border-color: var(--acc-ink);
        color: var(--acc-ink);
        background: var(--soft);
        font-weight: 600;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .panel h2 {
        font: 600 18px var(--f-head);
        margin: 0;
      }
      .panel h3 {
        font: 600 15px var(--f-head);
        margin: 0;
      }
      .panel p {
        margin: 0;
      }
      .muted {
        color: var(--ink2);
        font-size: 14px;
      }
      .menu {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .mi {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        border: 1.5px solid var(--tan);
        background: var(--surface);
        border-radius: 14px;
        padding: 13px 15px;
        cursor: pointer;
        color: var(--ink);
      }
      .mi b {
        font: 600 16px var(--f-head);
      }
      .mi span {
        font-size: 13px;
        color: var(--ink2);
      }
      .mi:hover {
        border-color: var(--acc-ink);
      }
      .qtext {
        font: 600 clamp(20px, 5.6vw, 26px)/1.3 var(--f-head);
        margin: 0;
        overflow-wrap: anywhere;
      }
      input[type="text"],
      select,
      textarea {
        width: 100%;
        font: 16px var(--f-body);
        padding: 11px 12px;
        border-radius: 12px;
        border: 1.5px solid var(--tan);
        background: var(--bg);
        color: var(--ink);
      }
      textarea {
        min-height: 84px;
        resize: vertical;
        word-break: break-all;
      }
      .fb {
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 500;
      }
      .fb.ok {
        background: var(--okbg);
        color: var(--ok);
      }
      .fb.no {
        background: var(--badbg);
        color: var(--bad);
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .opt {
        border: 1.5px solid var(--tan);
        background: var(--surface);
        color: var(--ink);
        border-radius: 12px;
        padding: 12px 14px;
        text-align: left;
        font: 500 16px var(--f-body);
        cursor: pointer;
      }
      .opt.on {
        border-color: var(--acc-ink);
        background: var(--soft);
      }
      .opt.good {
        border-color: var(--ok);
        background: var(--okbg);
        color: var(--ok);
      }
      .opt.bad {
        border-color: var(--bad);
        background: var(--badbg);
        color: var(--bad);
      }
      .opt.miss {
        border-color: var(--warn);
        border-style: dashed;
      }
      .mgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .mgrid .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .mgrid .opt {
        font-size: 14px;
        padding: 10px;
        overflow-wrap: anywhere;
      }
      .opt.done {
        border-color: var(--ok);
        background: var(--okbg);
        color: var(--ok);
        opacity: 0.7;
      }
      .groups {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .grp {
        border: 2px dashed var(--tan);
        border-radius: 14px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 92px;
        background: var(--surface);
        cursor: pointer;
        text-align: left;
        color: var(--ink);
        min-width: 0;
      }
      .grp.armed {
        border-color: var(--acc-ink);
        background: var(--soft);
      }
      .grp b {
        font: 600 14px var(--f-head);
      }
      .pool {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 40px;
      }
      .pc {
        border: 1.5px solid var(--tan);
        background: var(--surface);
        color: var(--ink);
        border-radius: 10px;
        padding: 6px 10px;
        font: 500 14px var(--f-body);
        cursor: pointer;
        text-align: left;
      }
      .pc.sel {
        border-color: var(--acc-ink);
        background: var(--soft);
        box-shadow: 0 0 0 2px var(--acc-ink);
      }
      .pc.good {
        border-color: var(--ok);
        background: var(--okbg);
        color: var(--ok);
      }
      .pc.bad {
        border-color: var(--bad);
        background: var(--badbg);
        color: var(--bad);
      }
      .pc small {
        display: block;
        font-size: 11px;
        font-weight: 600;
      }
      .list {
        margin: 0;
        padding-left: 20px;
      }
      .list li {
        margin: 2px 0;
      }
      .score {
        font: 700 40px var(--f-head);
        color: var(--acc-ink);
        margin: 0;
      }
      .msg {
        font-size: 14px;
        min-height: 20px;
      }
      .cards-empty {
        text-align: center;
        padding: 30px 10px;
      }
      .kbd {
        font-size: 12px;
        color: var(--ink2);
        text-align: center;
      }
      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: pop 0.18s ease-out;
        }
        @keyframes pop {
          from {
            transform: scale(0.97);
            opacity: 0.6;
          }
          to {
            transform: none;
            opacity: 1;
          }
        }
      }
      @media (max-width: 420px) {
        .groups {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <div class="wrap">
      <header class="top">
        <div class="toprow">
          <h1>
            <svg viewBox="0 0 28 38" aria-hidden="true">
              <rect x="9" y="2" width="10" height="10" rx="2" fill="#f2a52b" />
              <rect x="3" y="14" width="10" height="10" rx="2" fill="#f26b5a" />
              <rect
                x="15"
                y="14"
                width="10"
                height="10"
                rx="2"
                fill="#f26b5a"
              />
              <rect
                x="9"
                y="26"
                width="10"
                height="10"
                rx="2"
                fill="#f6ebdc"
              /></svg
            ><span>Hopscotch</span>
          </h1>
          <div class="lang" id="langGrp" role="group" aria-label="Language">
            <button data-act="lang" data-v="en" id="l-en" aria-pressed="true">
              EN</button
            ><button data-act="lang" data-v="es" id="l-es" aria-pressed="false">
              ES
            </button>
          </div>
        </div>
        <p id="sub">Phrase cards and exercises · Level A2</p>
      </header>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-act="tab" data-v="cards" id="t-cards">
          Cards
        </button>
        <button role="tab" data-act="tab" data-v="ex" id="t-ex">
          Exercises
        </button>
        <button role="tab" data-act="tab" data-v="set" id="t-set">
          Settings
        </button>
      </nav>
      <main id="main"></main>
    </div>

    <script>
      /* ============ DATA: edit here ============
CARDS: lesson, en, uk (English meaning), ex (exactly one ___), ans (word in the gap), col (2-3 collocations),
       dict (word for Cambridge), say (optional: how to read it aloud), alt (optional: other accepted gap answers),
       acc (optional: other accepted dictation answers)
FORKS: lesson, word, ok (go with it), bad (does not), why
ES / ES_WHY / ES_TITLES / ES_CATS (below the lists): Spanish translations, fork explanations and group names
SORTS: lesson, title, cats (group name -> phrases from CARDS)
A new lesson name in CARDS automatically becomes a new lesson button. */
      /*DATA START*/
      const L1 = "Lesson 1",
        L2 = "Lesson 2";
      const CARDS = [
        {
          lesson: L1,
          en: "only child",
          uk: "a child with no brothers or sisters",
          ex: "I have no brothers or sisters. I'm an ___ child.",
          ans: "only",
          col: ["be an only child", "grow up as an only child"],
          dict: "only child",
        },
        {
          lesson: L1,
          en: "nephew",
          uk: "the son of your brother or sister",
          ex: "My brother has a son. He is my ___.",
          ans: "nephew",
          col: ["my nephew", "nephew and niece", "a young nephew"],
          dict: "nephew",
        },
        {
          lesson: L1,
          en: "stepmother",
          uk: "your father's wife, when she is not your mother",
          ex: "My dad has a new wife. She is my ___.",
          ans: "stepmother",
          col: [
            "my stepmother",
            "a kind stepmother",
            "stepmother and stepfather",
          ],
          dict: "stepmother",
        },
        {
          lesson: L1,
          en: "stepfather",
          uk: "your mother's husband, when he is not your father",
          ex: "My mum has a new husband. He is my ___.",
          ans: "stepfather",
          col: [
            "my stepfather",
            "live with my stepfather",
            "a nice stepfather",
          ],
          dict: "stepfather",
        },
        {
          lesson: L1,
          en: "daughter",
          uk: "your female child",
          ex: "They have two sons and one ___.",
          ans: "daughter",
          col: ["my daughter", "son and daughter", "a baby daughter"],
          dict: "daughter",
        },
        {
          lesson: L1,

      /* ============ helpers ============ */
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const norm = (s) =>
        String(s)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");
      const shuffle = (a) => {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const sample = (a, n) => shuffle(a.slice()).slice(0, n);
      const BY = {},
        IDX = {};
      CARDS.forEach((c, i) => {
        BY[c.en] = c;
        IDX[c.en] = i;
      });
      const LESSONS = [...new Set(CARDS.map((c) => c.lesson))];
      const IV = [1, 3, 7, 14, 30, 60];
      const KEY = "hopscotch-a2-v1";
      const today = () => {
        const d = new Date();
        return Math.floor(
          (d.getTime() - d.getTimezoneOffset() * 60000) / 864e5,
        );
      };
      const ICON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

      /* ============ saved state ============ */
      let S = {
        prog: {},
        batches: {},
        set: {
          sel: [],
          mode: "today",
          shuffle: false,
          reverse: false,
          voice: "",
          exSrc: "all",
          lang: "en",
          mean: "auto",
        },

      let UI = { tab: "cards" },
        flipped = false,
        gapOpen = false,
        X = null,
        resetArmed = false,
        resetTimer = 0,
        warned = false;
      function load() {
        try {
          const r = localStorage.getItem(KEY);
          if (r) {
            const o = JSON.parse(r);
            if (o && typeof o === "object") {
              S.prog = o.prog || {};
              S.batches = o.batches || {};
              S.set = Object.assign(S.set, o.set || {});
            }
          }
        } catch (e) {
          warned = true;
        }
        S.set.sel = (S.set.sel || []).filter((l) => LESSONS.includes(l));
        if (S.set.sel.length === LESSONS.length) S.set.sel = [];
        if (S.set.lang !== "es") S.set.lang = "en";
        if (!["auto", "en", "es"].includes(S.set.mean)) S.set.mean = "auto";
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {
          warned = true;
        }
      }

      /* ============ language helpers ============ */
      const t = (k, ...a) => {
        let s = (TX[S.set.lang] && TX[S.set.lang][k]) || TX.en[k] || k;
        a.forEach((v, i) => {
          s = s.split("{" + i + "}").join(v);
        });
        return s;
      };
      const meanLang = () =>
        S.set.mean === "en" || S.set.mean === "es" ? S.set.mean : S.set.lang;
      const mean = (c) => (meanLang() === "es" && ES[c.en] ? ES[c.en] : c.uk);
      const lname = (l) => {
        const es = S.set.lang === "es";
        return l.replace(/^Lesson (\d+)$/, es ? "Lección $1" : "Lesson $1");
      };
      const catName = (n) =>
        S.set.lang === "es" && ES_CATS[n] ? ES_CATS[n] : n;
      const sortTitle = (x) =>
        S.set.lang === "es" && ES_TITLES[x] ? ES_TITLES[x] : x;
      const whyText = (f) =>
        S.set.lang === "es" && ES_WHY[f.word] ? ES_WHY[f.word] : f.why;
      const modeName = (m) =>
        t({ today: "mToday", all: "mAll", review: "mReview", new: "mNew" }[m]);

      /* ============ audio ============ */
      let VOICES = [];
      const NOVELTY =
        /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Superstar|Jester|Organ|Good News|Hysterical|Deranged|Pipe Organ|Fred|Junior|Ralph|Kathy|Princess|Agnes|Grandma|Grandpa|Flo|Reed|Rocko|Sandy|Shelley|Eddy)\b/i;
      const GOOD = /natural|neural|premium|enhanced|siri|google/i;
      const vScore = (v) =>
        (GOOD.test(v.name) ? 10 : 0) +
        (/en[-_]GB/i.test(v.lang) ? 3 : 0) +
        (/en[-_](US|AU|IE)/i.test(v.lang) ? 1 : 0);
      function loadVoices() {
        try {
          VOICES = speechSynthesis
            .getVoices()
            .filter(
              (v) => /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name),
            );
          VOICES.sort((a, b) => vScore(b) - vScore(a));
        } catch (e) {
          VOICES = [];
        }
      }
      function pickVoice() {
        return (
          VOICES.find((v) => v.voiceURI === S.set.voice) || VOICES[0] || null
        );
      }
      function speak(t, slow) {
        try {
          if (!("speechSynthesis" in window)) return;
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(t);
          const v = pickVoice();
          if (v) {
            u.voice = v;
            u.lang = v.lang;
          } else u.lang = "en-GB";
          u.rate = slow ? 0.6 : 0.9;
          speechSynthesis.speak(u);
        } catch (e) {}
      }
      const sayText = (c) => c.say || c.en;
      try {
        loadVoices();
        if ("speechSynthesis" in window)
          speechSynthesis.addEventListener("voiceschanged", () => {
            loadVoices();
            if (UI.tab === "set") render();
          });
      } catch (e) {}

      /* ============ pools and batches ============ */
      const pool = () =>
        CARDS.filter((c) => !S.set.sel.length || S.set.sel.includes(c.lesson));
      const isAgain = (c) => S.prog[c.en] && S.prog[c.en].again;
      function sigOf() {
        return (
          S.set.mode +
          "|" +
          S.set.sel.slice().sort().join(",") +
          "|" +
          (S.set.shuffle ? "s" : "o")
        );
      }
      function buildIds() {
        const p = pool(),
          t0 = today(),
          m = S.set.mode,
          pr = (c) => S.prog[c.en];
        let list;
        if (m === "today") {
          const again = p.filter((c) => pr(c) && pr(c).again);
          const due = p
            .filter((c) => pr(c) && !pr(c).again && pr(c).due <= t0)
            .sort((a, b) => pr(a).due - pr(b).due);
          const nw = p.filter((c) => !pr(c));
          list = [...again, ...due, ...nw].slice(0, 20);
        } else if (m === "review") list = p.filter((c) => pr(c) && pr(c).again);
        else if (m === "new") list = p.filter((c) => !pr(c));
        else list = p.slice();
        const ids = list.map((c) => c.en);
        return S.set.shuffle ? shuffle(ids) : ids;
      }
      function getBatch() {
        const sig = sigOf();
        let b = S.batches[sig];
        if (b) {
          b.ids = b.ids.filter((e) => BY[e]);
          if (b.pos > b.ids.length) b.pos = b.ids.length;
          if (
            S.set.mode === "today" &&
            !b.retry &&
            b.pos >= b.ids.length &&
            b.day !== today()
          )
            b = null;
        }
        if (!b) {
          b = { ids: buildIds(), pos: 0, marks: {}, day: today() };
          S.batches[sig] = b;
          save();
        }
        return b;
      }
      const activeOf = (b) => b.retry || b;
      function rate(known) {
        const b = getBatch(),
          a = activeOf(b),
          en = a.ids[a.pos];
        if (!en) return;
        const p =
          S.prog[en] || (S.prog[en] = { s: 0, due: today(), again: false });
        if (known) {
          p.due = today() + IV[Math.min(p.s, IV.length - 1)];
          p.s = Math.min(p.s + 1, IV.length);
          p.again = false;
          a.marks[en] = "k";
        } else {
          p.again = true;
          p.s = 0;
          p.due = today();
          a.marks[en] = "a";
        }
        a.pos++;
        flipped = false;
        gapOpen = false;
        save();
        render();
      }
      function restart() {
        const sig = sigOf();
        delete S.batches[sig];
        flipped = false;
        gapOpen = false;
        save();
        render();
      }
      function anotherBatch() {
        const sig = sigOf();
        delete S.batches[sig];
        flipped = false;
        gapOpen = false;
        save();
        render();
      }
      function retryWords() {
        const b = getBatch(),
          a = activeOf(b);
        const ids = a.ids.filter((e) => a.marks[e] === "a");
        if (!ids.length) return;
        b.retry = {
          ids: S.set.shuffle ? shuffle(ids.slice()) : ids,
          pos: 0,
          marks: {},
        };
        flipped = false;
        gapOpen = false;
        save();
        render();
      }
      function addReview(list) {
        list.forEach((en) => {
          const p =
            S.prog[en] || (S.prog[en] = { s: 0, due: today(), again: false });
          p.again = true;
          p.s = 0;
          p.due = today();
        });
        save();
      }

      /* ============ cards tab ============ */

      }
      function statsLine() {
        const p = pool();

        p.forEach((c) => {

          if (!r) nw++;

        return `<div class="stats">${t("stats", p.length, nw, ag, kn)}</div>`;

        if (!flipped) {

    <div class="bhead"><span class="b-en">${esc(c.en)}</span><p class="b-uk">${esc(mean(c))}</p></div>
    <p class="ex">${esc(a)}<button class="gap" data-act="gap" aria-label="${esc(t("showAns"))}">${gapOpen ? esc(c.ans) : "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"}</button>${esc(b)}</p>

      }
      function renderCards() {
        const b = getBatch(),

      <div class="row">${rv.length ? `<button class="btn wide" data-act="retry">${esc(t("btnRetry"))}</button>` : ""}<button class="btn wide ${rv.length ? "ghost" : ""}" data-act="another">${esc(S.set.mode === "today" ? t("btnAnother") : t("btnAgain"))}</button><button class="btn wide ghost" data-act="toex">${esc(t("btnToEx"))}</button></div></div>`;
        } else {
          const c = BY[a.ids[a.pos]];
          h += `<div class="row sp"><span class="cnt">${a.pos + 1} / ${total}</span><span class="cnt">${esc(b.retry ? t("reviewingWords") : modeName(S.set.mode))}</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${a.pos}"><i style="width:${Math.round((a.pos / total) * 100)}%"></i></div>
      ${cardHtml(c)}
      <div class="row"><button class="btn warn wide" data-act="again">${esc(t("again"))}</button><button class="btn good wide" data-act="known">${esc(t("know"))}</button></div>
      <p class="kbd">${esc(t("kbd"))}</p>`;
        }
        return h;
      }

      /* ============ exercises ============ */
      const EXIDS = [
        "match",
        "gap",
        "quiz",
        "dict",
        "fork",
        "sort",
        "fix",
        "sit",
      ];
      function exPool() {
        const p = pool();
        return S.set.exSrc === "review" ? p.filter(isAgain) : p;
      }
      const inSel = (o) => !S.set.sel.length || S.set.sel.includes(o.lesson);
      function variants(en) {
        const exp = (s) => {
          const m = s.match(/\(([^)]*)\)/);
          if (!m) return [s];
          return [...exp(s.replace(m[0], m[1])), ...exp(s.replace(m[0], ""))];
        };
        const out = new Set();
        exp(en).forEach((s) => {
          const m = s.match(/(\S+)\/(\S+)/);
          if (m) {
            out.add(s.replace(m[0], m[1]));
            out.add(s.replace(m[0], m[2]));
          } else out.add(s);
        });
        return [...out].map(norm);
      }
      function startEx(ty) {
        const p = exPool();
        X = { type: ty, wrong: [], i: 0, sc: 0, q: [], added: false };
        if (ty === "fork") {
          X.q = shuffle(FORKS.filter(inSel)).map((f) => ({
            f,
            opts: shuffle([...f.ok, ...f.bad]),
          }));
          X.sel = [];
        } else if (ty === "sort") {
          X.sets = SORTS.filter(inSel);
          X.s = 0;
          if (X.sets.length) initSort();
        } else if (ty === "match") {
          const seen = new Set(),
            items = [];
          shuffle(p.slice()).forEach((c) => {
            if (!seen.has(mean(c))) {
              seen.add(mean(c));
              items.push(c);
            }
          });
          X.all = items;
          X.n = 0;
          X.items = items.slice(0, 6);
          X.L = shuffle(X.items.map((c) => c.en));
          X.R = shuffle(X.items.map((c) => c.en));
          X.done = [];
          X.pend = null;
          X.flash = null;
        } else if (ty === "quiz") {
          X.q = shuffle(p.slice()).map((c) => {
            const dir = Math.random() < 0.5 ? 0 : 1,
              txt = (o) => (dir ? o.en : mean(o)),
              right = txt(c),
              used = new Set([right]),
              d = [];
            shuffle(CARDS.filter((o) => o.en !== c.en)).forEach((o) => {
              if (d.length < 3 && !used.has(txt(o))) {
                used.add(txt(o));
                d.push(txt(o));
              }
            });
            return { c, dir, right, opts: shuffle([right, ...d]) };
          });
          X.pick = null;
        } else if (ty === "fix") {
          X.q = shuffle(FIXES.filter(inSel));
          X.pick = null;
        } else if (ty === "sit") {
          X.q = shuffle(SITS.filter(inSel)).map((s) => ({
            s,
            opts: shuffle(s.opts.slice()),
          }));
          X.pick = null;
        } else X.q = shuffle(p.slice());
        X.empty =
          ty === "fork"
            ? !X.q.length
            : ty === "sort"
              ? !X.sets.length
              : ty === "match"
                ? X.items.length < 2
                : !X.q.length;
        render();
      }
      function initSort() {
        const s = X.sets[X.s];
        X.cats = Object.keys(s.cats);
        X.items = shuffle(Object.values(s.cats).flat());
        X.place = {};
        X.pick = null;
        X.checked = false;
      }
      function resultView(label, score, total, note) {
        const w = [...new Set(X.wrong)];
        return `<div class="panel"><h2>${esc(label)}</h2><p class="score">${score} / ${total}</p>
   ${w.length ? `<div><h3>${esc(t("mistakes"))}</h3><ul class="list">${w.map((e) => `<li><b>${esc(e)}</b> <span class="muted">— ${esc(mean(BY[e]))}</span></li>`).join("")}</ul></div>` : `<p>${esc(t("noMistakes"))}</p>`}
   ${note || ""}
   <div class="row">${w.length ? `<button class="btn wide" data-act="x-add" ${X.added ? "disabled" : ""}>${esc(X.added ? t("added") : t("addRev"))}</button>` : ""}<button class="btn wide ghost" data-act="x-again">${esc(t("tryAgain"))}</button><button class="btn wide ghost" data-act="x-back">${esc(t("allEx"))}</button></div></div>`;
      }
      function renderEx() {
        if (!X) {
          const n = exPool().length;
          return `<div class="panel"><h2>${esc(t("exTitle"))}</h2><p class="muted">${esc(t("exIntro"))}</p>
      <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${S.set.exSrc === "all" ? "on" : ""}" data-act="exsrc" data-v="all">${esc(t("exAll"))}</button><button class="${S.set.exSrc === "review" ? "on" : ""}" data-act="exsrc" data-v="review">${esc(t("exRev"))}</button></div>
      <p class="stats">${esc(t("exAvail", n))}</p></div>
      <div class="menu">${EXIDS.map((e) => `<button class="mi" data-act="xstart" data-v="${e}"><b>${esc(t("exn_" + e))}</b><span>${esc(t("exd_" + e))}</span></button>`).join("")}</div>`;
        }
        const back = `<div class="row sp"><button class="tog" data-act="x-back">${esc(t("exBack"))}</button><span class="cnt">${esc(t("exn_" + X.type))}</span></div>`;
        if (X.empty)
          return (
            back +
            `<div class="panel cards-empty"><p class="muted">${esc(["fork", "sort", "fix", "sit"].includes(X.type) ? t("exNoSet") : t("exNoPhrases"))}</p></div>`
          );
        return (
          back +
          {
            match: vMatch,
            gap: vGap,
            quiz: vQuiz,
            dict: vDict,
            fork: vFork,
            sort: vSort,
            fix: vFix,
            sit: vSit,
          }[X.type]()
        );
      }
      const prog = () =>
        `<div class="bar"><i style="width:${Math.round((X.i / X.q.length) * 100)}%"></i></div>`;
      function vMatch() {
        if (X.done.length === X.items.length)
          return resultView(
            t("rMatch"),
            X.all.length - new Set(X.wrong).size,
            X.all.length,
          );
        const L = X.L.map((en) => {
          const d = X.done.includes(en);
          return `<button class="opt ${d ? "done" : ""} ${X.pend && X.pend.side === "l" && X.pend.k === en ? "on" : ""} ${X.flash && X.flash.l === en ? "bad" : ""}" data-act="x-m" data-side="l" data-k="${esc(en)}" ${d ? "disabled" : ""}>${esc(en)}</button>`;
        }).join("");
        const R = X.R.map((en) => {
          const d = X.done.includes(en);
          return `<button class="opt ${d ? "done" : ""} ${X.pend && X.pend.side === "r" && X.pend.k === en ? "on" : ""} ${X.flash && X.flash.r === en ? "bad" : ""}" data-act="x-m" data-side="r" data-k="${esc(en)}" ${d ? "disabled" : ""}>${esc(mean(BY[en]))}</button>`;
        }).join("");
        return `<div class="panel"><p class="muted">${esc(t("matchHelp"))}</p><div class="mgrid"><div class="col">${L}</div><div class="col">${R}</div></div></div>`;
      }
      function vGap() {
        if (X.i >= X.q.length) return resultView(t("rGap"), X.sc, X.q.length);
        const c = X.q[X.i],
          [a, b] = c.ex.split("___"),
          fb = X.fb;
        const mid = fb
          ? `<b>${esc(c.ans)}</b>`
          : `<span class="muted">_____</span>`;
        return (
          prog() +
          `<div class="panel"><p class="qtext">${esc(a)}${mid}${esc(b)}</p><p class="muted">${esc(t("meaningLbl"))}${esc(mean(c))}</p>${X.hint ? `<p class="muted">${esc(t("firstLetterLbl"))}<b>${esc(c.ans[0])}</b></p>` : ""}
   <input type="text" id="xin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="${esc(t("yourAnswer"))}" value="${esc(X.val || "")}" ${fb ? "disabled" : ""}>
   ${fb ? `<div class="fb ${fb === "ok" ? "ok" : "no"}">${esc(fb === "ok" ? t("correct") : t("answerIs") + c.ans)}</div>` : ""}
   <div class="row">${fb ? `<button class="btn wide" data-primary data-act="x-next">${esc(t("next"))}</button>` : `<button class="btn ghost wide" data-act="x-hint">${esc(t("firstLetter"))}</button><button class="btn wide" data-primary data-act="x-check">${esc(t("check"))}</button>`}</div></div>`
        );
      }
      function vQuiz() {
        if (X.i >= X.q.length) return resultView(t("rQuiz"), X.sc, X.q.length);
        const q = X.q[X.i],
          done = X.pick !== null;
        return (
          prog() +
          `<div class="panel"><p class="muted">${esc(q.dir ? t("quizQ1") : t("quizQ0"))}</p><p class="qtext">${esc(q.dir ? mean(q.c) : q.c.en)}</p>
   <div class="opts">${q.opts.map((o, i) => `<button class="opt ${done ? (o === q.right ? "good" : i === X.pick ? "bad" : "") : ""}" data-act="x-opt" data-v="${i}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
   ${done ? `<button class="btn" data-primary data-act="x-next">${esc(t("next"))}</button>` : ""}</div>`
        );
      }
      function vDict() {
        if (X.i >= X.q.length) return resultView(t("rDict"), X.sc, X.q.length);
        const c = X.q[X.i],
          fb = X.fb;
        return (
          prog() +
          `<div class="panel"><p class="muted">${esc(t("dictHelp"))}</p>
   <div class="row"><button class="btn ghost wide" data-act="x-say" data-slow="0">${ICON}${esc(t("listen"))}</button><button class="btn ghost wide" data-act="x-say" data-slow="1">${ICON}${esc(t("slower"))}</button></div>
   <input type="text" id="xin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="${esc(t("typeHear"))}" value="${esc(X.val || "")}" ${fb ? "disabled" : ""}>
   ${fb ? `<div class="fb ${fb === "ok" ? "ok" : "no"}">${esc(fb === "ok" ? t("correct") : t("phraseIs") + c.en)}</div><p class="muted">${esc(mean(c))}</p>` : ""}
   <div class="row">${fb ? `<button class="btn wide" data-primary data-act="x-next">${esc(t("next"))}</button>` : `<button class="btn wide" data-primary data-act="x-check">${esc(t("check"))}</button>`}</div></div>`
        );
      }
      function vFork() {
        if (X.i >= X.q.length) return resultView(t("rFork"), X.sc, X.q.length);
        const q = X.q[X.i],
          f = q.f,
          ch = X.checked;
        return (
          prog() +
          `<div class="panel"><p class="muted">${esc(t("forkHelp"))}</p><p class="qtext">${esc(f.word)} …</p>
   <div class="opts">${q.opts
     .map((o, i) => {
       const s = X.sel.includes(i),
         ok = f.ok.includes(o);
       let cl = s ? "on" : "";
       if (ch) {
         cl = s && ok ? "good" : s && !ok ? "bad" : !s && ok ? "miss" : "";
       }
       return `<button class="opt ${cl}" data-act="x-tog" data-v="${i}" aria-pressed="${s}" ${ch ? "disabled" : ""}>${esc(o)}</button>`;
     })
     .join("")}</div>
   ${ch ? `<div class="fb ${X.fok ? "ok" : "no"}">${esc((X.fok ? t("forkOk") : t("forkNo")) + whyText(f))}</div>` : ""}
   <div class="row">${ch ? `<button class="btn wide" data-act="x-next">${esc(t("next"))}</button>` : `<button class="btn wide" data-act="x-check" ${X.sel.length ? "" : "disabled"}>${esc(t("check"))}</button>`}</div></div>`
        );
      }
      function vSort() {
        const s = X.sets[X.s],
          placed = Object.keys(X.place).length;
        const chip = (ph, extra) =>
          `<button class="pc ${extra || ""}" data-act="x-pc" data-v="${esc(ph)}">${esc(ph)}</button>`;
        const left = X.items.filter((p) => !(p in X.place));
        const gs = X.cats
          .map((cn, ci) => {
            const here = X.items.filter((p) => X.place[p] === cn);
            return `<div class="grp ${X.pick && !X.checked ? "armed" : ""}" data-act="x-cat" data-v="${ci}" role="button" tabindex="0"><b>${esc(catName(cn))}</b><div class="pool">${here
              .map((p) => {
                if (!X.checked) return chip(p);
                const ok = s.cats[cn].includes(p);
                const right = Object.keys(s.cats).find((k) =>
                  s.cats[k].includes(p),
                );
                return `<button class="pc ${ok ? "good" : "bad"}" disabled>${esc(p)}${ok ? "" : `<small>→ ${esc(catName(right))}</small>`}</button>`;
              })
              .join("")}</div></div>`;
          })
          .join("");
        let score = 0;
        if (X.checked)
          X.items.forEach((p) => {
            if (s.cats[X.place[p]] && s.cats[X.place[p]].includes(p)) score++;
          });
        return `<div class="panel"><h3>${esc(sortTitle(s.title))}</h3><p class="muted">${esc(t("sortHelp"))}</p>
   <div class="pool">${left.map((p) => chip(p, X.pick === p ? "sel" : "")).join("") || `<span class="muted">${esc(t("sortAll"))}</span>`}</div>
   <div class="groups">${gs}</div>
   ${X.checked ? `<div class="fb ${score === X.items.length ? "ok" : "no"}">${esc(t("sortScore", score, X.items.length))}</div>` : ""}
   <div class="row">${X.checked ? `<button class="btn wide ghost" data-act="x-reset">${esc(t("tryAgain"))}</button>${X.s < X.sets.length - 1 ? `<button class="btn wide" data-act="x-nextset">${esc(t("nextSet"))}</button>` : ""}` : `<button class="btn wide ghost" data-act="x-reset">${esc(t("reset"))}</button><button class="btn wide" data-act="x-check" ${placed === X.items.length ? "" : "disabled"}>${esc(t("check"))}</button>`}</div></div>`;
      }
      const endView = (k) =>
        `<div class="panel"><h2>${esc(t(k))}</h2><p class="score">${X.sc} / ${X.q.length}</p><div class="row"><button class="btn wide ghost" data-act="x-again">${esc(t("tryAgain"))}</button><button class="btn wide ghost" data-act="x-back">${esc(t("allEx"))}</button></div></div>`;
      function vFix() {
        if (X.i >= X.q.length) return endView("rFix");
        const q = X.q[X.i],
          fb = X.fb;
        return (
          prog() +
          `<div class="panel"><p class="muted">${esc(t("fixHelp"))}</p>
   <div class="opts">${q.parts.map((p, k) => `<button class="opt ${fb ? (k === q.bad ? "good" : k === X.pick ? "bad" : "") : X.pick === k ? "on" : ""}" data-act="x-fp" data-v="${k}" ${fb ? "disabled" : ""}>${esc(fb && k === q.bad ? q.fix[0] : p)}</button>`).join("")}</div>
   <input type="text" id="xin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="${esc(t("fixType"))}" placeholder="${esc(t("fixType"))}" value="${esc(X.val || "")}" ${fb ? "disabled" : ""}>
   ${fb ? `<div class="fb ${fb === "ok" ? "ok" : "no"}">${esc((fb === "ok" ? t("correct") : t("answerIs") + q.fix[0] + ".") + " " + (S.set.lang === "es" && q.es ? q.es : q.why))}</div>` : ""}
   <div class="row">${fb ? `<button class="btn wide" data-primary data-act="x-next">${esc(t("next"))}</button>` : `<button class="btn wide" data-primary data-act="x-check">${esc(t("check"))}</button>`}</div></div>`
        );
      }
      function vSit() {
        if (X.i >= X.q.length) return endView("rSit");
        const q = X.q[X.i],
          s = q.s,
          done = X.pick !== null;
        return (
          prog() +
          `<div class="panel"><p class="muted">${esc(t("exd_sit"))}</p><p class="qtext">${esc(s.sit)}</p>${S.set.lang === "es" && s.es ? `<p class="muted">${esc(s.es)}</p>` : ""}
   <div class="opts">${q.opts.map((o, i) => `<button class="opt ${done ? (o === s.ok ? "good" : i === X.pick ? "bad" : "") : ""}" data-act="x-sopt" data-v="${i}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
   ${done ? `<button class="btn" data-primary data-act="x-next">${esc(t("next"))}</button>` : ""}</div>`
        );
      }
      function xInput() {
        const el = $("#xin");
        return el ? el.value : "";
      }
      function xAct(a, el) {
        switch (a) {
          case "x-back":
            X = null;
            break;
          case "x-again":
            startEx(X.type);
            return;
          case "x-add":
            addReview(X.wrong);
            X.added = true;
            break;
          case "x-m": {
            const side = el.dataset.side,
              k = el.dataset.k;
            if (!X.pend || X.pend.side === side) {
              X.pend = { side, k };
              break;
            }
            const l = side === "l" ? k : X.pend.k,
              r = side === "r" ? k : X.pend.k;
            X.pend = null;
            if (l === r) {
              X.done.push(l);
              if (X.done.length === X.items.length && X.n + 6 < X.all.length) {
                X.n += 6;
                X.items = X.all.slice(X.n, X.n + 6);
                X.L = shuffle(X.items.map((c) => c.en));
                X.R = shuffle(X.items.map((c) => c.en));
                X.done = [];
              }
            } else {
              X.wrong.push(l);
              X.flash = { l, r };
              setTimeout(() => {
                if (X) {
                  X.flash = null;
                  render();
                }
              }, 600);
            }
            break;
          }
          case "x-hint":
            X.val = xInput();
            X.hint = true;
            break;
          case "x-check": {
            if (X.type === "fix") {
              const q = X.q[X.i];
              X.val = xInput();
              if (X.pick === null || !norm(X.val)) return;
              const ok =
                X.pick === q.bad && q.fix.map(norm).includes(norm(X.val));
              X.fb = ok ? "ok" : "no";
              if (ok) X.sc++;
              break;
            }
            if (X.type === "fork") {
              const f = X.q[X.i],
                q = f.f,
                sel = X.sel.map((i) => f.opts[i]);
              X.fok =
                sel.length === q.ok.length &&
                sel.every((o) => q.ok.includes(o));
              if (X.fok) X.sc++;
              X.checked = true;
              break;
            }
            if (X.type === "sort") {
              X.checked = true;
              break;
            }
            const c = X.q[X.i],
              v = norm(xInput());
            X.val = xInput();
            let good;
            if (X.type === "gap")
              good = [c.ans, ...(c.alt || [])].map(norm).includes(v);
            else
              good =
                variants(c.en).includes(v) ||
                (c.say && norm(c.say) === v) ||
                (c.acc || []).map(norm).includes(v);
            if (!v) return;
            X.fb = good ? "ok" : "no";
            if (good) X.sc++;
            else X.wrong.push(c.en);
            break;
          }
          case "x-next":
            X.i++;
            X.fb = null;
            X.val = "";
            X.hint = false;
            X.pick = null;
            X.sel = [];
            X.checked = false;
            break;
          case "x-opt": {
            const q = X.q[X.i];
            X.pick = +el.dataset.v;
            if (q.opts[X.pick] === q.right) X.sc++;
            else X.wrong.push(q.c.en);
            break;
          }
          case "x-fp":
            if (!X.fb) {
              X.val = xInput();
              X.pick = +el.dataset.v;
            }
            break;
          case "x-sopt": {
            const q = X.q[X.i];
            if (X.pick !== null) break;
            X.pick = +el.dataset.v;
            if (q.opts[X.pick] === q.s.ok) X.sc++;
            break;
          }
          case "x-tog": {
            const i = +el.dataset.v,
              k = X.sel.indexOf(i);
            if (k >= 0) X.sel.splice(k, 1);
            else X.sel.push(i);
            break;
          }
          case "x-say": {
            const c = X.q[X.i];
            speak(sayText(c), el.dataset.slow === "1");
            return;
          }
          case "x-pc": {
            const p = el.dataset.v;
            if (p in X.place) delete X.place[p];
            else X.pick = X.pick === p ? null : p;
            break;
          }
          case "x-cat": {
            if (X.checked || !X.pick) break;
            X.place[X.pick] = X.cats[+el.dataset.v];
            X.pick = null;
            break;
          }
          case "x-reset":
            initSort();
            break;
          case "x-nextset":
            X.s++;
            initSort();
            break;
        }
        render();
        const i = $("#xin");
        if (i && !i.disabled && (a === "x-next" || a === "x-hint")) i.focus();
      }

      /* ============ settings ============ */
      function renderSet() {
        const cur = pickVoice(),
          L = S.set.lang,
          M = S.set.mean;
        const opts = VOICES.map(
          (v) =>
            `<option value="${esc(v.voiceURI)}" ${cur && cur.voiceURI === v.voiceURI ? "selected" : ""}>${GOOD.test(v.name) ? "★ " : ""}${esc(v.name)} (${esc(v.lang)})</option>`,
        ).join("");
        return `<div class="panel"><h2>${esc(t("langH"))}</h2>
    <p class="muted">${esc(t("uiLang"))}</p>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${L === "en" ? "on" : ""}" data-act="lang" data-v="en">English</button><button class="${L === "es" ? "on" : ""}" data-act="lang" data-v="es">Español</button></div>
    <p class="muted">${esc(t("meanLang"))}</p>
    <div class="seg" style="grid-template-columns:1fr 1fr 1fr"><button class="${M === "auto" ? "on" : ""}" data-act="mean" data-v="auto">${esc(t("meanAuto"))}</button><button class="${M === "en" ? "on" : ""}" data-act="mean" data-v="en">${esc(t("meanEn"))}</button><button class="${M === "es" ? "on" : ""}" data-act="mean" data-v="es">${esc(t("meanEs"))}</button></div></div>
   <div class="panel"><h2>${esc(t("voice"))}</h2>
    ${VOICES.length ? `<label for="voiceSel" class="muted">${esc(t("voiceLbl"))}</label><select id="voiceSel">${opts}</select><div class="row"><button class="btn ghost" data-act="listen">${ICON}${esc(t("listen"))}</button></div>` : `<p class="muted">${esc(t("noVoice"))}</p>`}
    <p class="muted">${t("iphone")}</p></div>
   <div class="panel"><h2>${esc(t("progressH"))}</h2>
    <p class="muted">${esc(t("saveHint"))}</p>
    <div class="row"><button class="btn" data-act="copycode">${esc(t("copyCode"))}</button></div>
    <textarea id="codeBox" readonly aria-label="${esc(t("copyCode"))}" placeholder="${esc(t("codePh"))}"></textarea>
    <label for="restoreBox" class="muted">${esc(t("restoreLbl"))}</label>
    <textarea id="restoreBox" placeholder="${esc(t("restorePh"))}"></textarea>
    <div class="row"><button class="btn ghost" data-act="restore">${esc(t("restoreBtn"))}</button><button class="btn warn" data-act="reset" id="resetBtn">${esc(resetArmed ? t("resetConfirm") : t("resetBtn"))}</button></div>
    <p class="msg" id="msg" role="status"></p></div>`;
      }
      function setMsg(txt, bad) {
        const m = $("#msg");
        if (m) {
          m.textContent = txt;
          m.style.color = bad ? "var(--bad)" : "var(--ok)";
        }
      }
      function makeCode() {
        return btoa(
          unescape(
            encodeURIComponent(
              JSON.stringify({
                v: 1,
                prog: S.prog,
                batches: S.batches,
                sel: S.set.sel,
              }),
            ),
          ),
        );
      }
      function applyCode(c) {
        const o = JSON.parse(
          decodeURIComponent(escape(atob(c.replace(/\s+/g, "")))),
        );
        if (!o || o.v !== 1 || typeof o.prog !== "object")
          throw new Error("bad");
        S.prog = o.prog;
        S.batches = o.batches || {};
        if (Array.isArray(o.sel))
          S.set.sel = o.sel.filter((l) => LESSONS.includes(l));
        save();
      }
      function copyCode() {
        let code = "";
        try {
          code = makeCode();
        } catch (e) {
          setMsg(t("msgNoCode"), true);
          return;
        }
        const box = $("#codeBox");
        box.value = code;
        box.focus();
        box.select();
        let p;
        try {
          p = navigator.clipboard.writeText(code);
        } catch (e) {
          p = null;
        }
        if (p && p.then)
          p.then(
            () => setMsg(t("msgCopied")),
            () => setMsg(t("msgSelect"), false),
          );
        else setMsg(t("msgSelect"), false);
      }

      /* ============ render + events ============ */
      function chrome() {
        $("#t-cards").textContent = t("tabCards");
        $("#t-ex").textContent = t("tabEx");
        $("#t-set").textContent = t("tabSet");
        $("#sub").textContent = t("sub");
        $("#langGrp").setAttribute("aria-label", t("langAria"));
        ["en", "es"].forEach((l) => {
          const b = $("#l-" + l);
          b.classList.toggle("on", S.set.lang === l);
          b.setAttribute("aria-pressed", S.set.lang === l);
        });
        try {
          document.documentElement.lang = S.set.lang;
        } catch (e) {}
      }
      function render() {
        ["cards", "ex", "set"].forEach((k) => {
          const b = $("#t-" + k);
          b.setAttribute("aria-selected", UI.tab === k);
        });
        chrome();
        const m = $("#main");
        m.innerHTML =
          `<div class="wrap" style="gap:14px">` +
          (UI.tab === "cards"
            ? renderCards()
            : UI.tab === "ex"
              ? renderEx()
              : renderSet()) +
          `</div>`;
      }
      document.addEventListener("click", (e) => {
        const tg = e.target;
        if (tg.closest && tg.closest("a")) return;
        const el = tg.closest && tg.closest("[data-act]");
        if (!el) return;
        const a = el.dataset.act,
          v = el.dataset.v;
        if (a.startsWith("x-")) {
          xAct(a, el);
          return;
        }
        switch (a) {
          case "tab":
            UI.tab = v;
            resetArmed = false;
            render();
            window.scrollTo(0, 0);
            return;
          case "lang":
            S.set.lang = v === "es" ? "es" : "en";
            X = null;
            save();
            break;
          case "mean":
            S.set.mean = v;
            X = null;
            save();
            break;
          case "lall":
            S.set.sel = [];
            flipped = false;
            gapOpen = false;
            X = null;
            save();
            break;
          case "lesson":
            toggleLesson(v);
            return;
          case "mode":
            S.set.mode = v;
            flipped = false;
            gapOpen = false;
            save();
            break;
          case "shuf":
            S.set.shuffle = !S.set.shuffle;
            flipped = false;
            gapOpen = false;
            save();
            break;
          case "rev":
            S.set.reverse = !S.set.reverse;
            save();
            break;
          case "restart":
            restart();
            return;
          case "flip":
            flipped = !flipped;
            gapOpen = false;
            break;
          case "gap":
            gapOpen = !gapOpen;
            break;
          case "known":
            rate(true);
            return;
          case "again":
            rate(false);
            return;
          case "say": {
            const c = CARDS[+v];
            speak(sayText(c));
            return;
          }
          case "another":
            anotherBatch();
            return;
          case "retry":
            retryWords();
            return;
          case "toex":
            UI.tab = "ex";
            X = null;
            break;
          case "exsrc":
            S.set.exSrc = v;
            save();
            break;
          case "xstart":
            startEx(v);
            return;
          case "listen":
            speak(t("sample"));
            return;
          case "copycode":
            copyCode();
            return;
          case "restore": {
            const r = $("#restoreBox").value.trim();
            if (!r) {
              setMsg(t("msgPaste"), true);
              return;
            }
            try {
              applyCode(r);
              flipped = false;
              X = null;
              setMsg(t("msgRestored"));
            } catch (err) {
              setMsg(t("msgBad"), true);
            }
            return;
          }
          case "reset":
            if (!resetArmed) {
              resetArmed = true;
              clearTimeout(resetTimer);
              resetTimer = setTimeout(() => {
                resetArmed = false;
                const b = $("#resetBtn");
                if (b) b.textContent = t("resetBtn");
              }, 4000);
              render();
              return;
            }
            resetArmed = false;
            S.prog = {};
            S.batches = {};
            flipped = false;
            gapOpen = false;
            X = null;
            save();
            render();
            setMsg(t("msgReset"));
            return;
        }
        render();
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "voiceSel") {
          S.set.voice = e.target.value;
          save();
        }
      });
      document.addEventListener("keydown", (e) => {
        const tg = e.target,
          tag = tg && tg.tagName;
        if (e.key === "Enter" && tg && tg.id === "xin") {
          e.preventDefault();
          const b = document.querySelector("[data-primary]");
          if (b) b.click();
          return;
        }
        if (UI.tab !== "cards" || /INPUT|TEXTAREA|SELECT/.test(tag)) return;
        const b = getBatch(),
          a = activeOf(b);
        if (!a.ids.length || a.pos >= a.ids.length) return;
        if (e.key === " ") {
          if (tag === "BUTTON" || tag === "A") return;
          e.preventDefault();
          flipped = !flipped;
          gapOpen = false;
          render();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          rate(false);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          rate(true);
        }
      });
      load();
      render();
    </script>
  </body>
</html>
